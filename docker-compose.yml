services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: rift-frontline/web:dev
    container_name: rift-web
    restart: unless-stopped
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/game-server/Dockerfile
    image: rift-frontline/server:dev
    container_name: rift-server
    restart: unless-stopped
    environment:
      PORT: "2567"
      NODE_ENV: production
    ports:
      - "2567:2567"

  nginx:
    image: nginx:1.27-alpine
    container_name: rift-nginx
    restart: unless-stopped
    depends_on:
      - web
      - server
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

networks:
  default:
    name: rift-net