events {}

http {
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 16m;

  # Map for WebSocket upgrade support
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream rift_web   { server web:80; }
  upstream rift_ws    { server server:2567; }

  server {
    listen 80;
    server_name _;

    # Health endpoint → game server
    location = /health {
      proxy_pass http://rift_ws;
      proxy_set_header Host $host;
    }

    # Static site (Vite preview) at root
    location / {
      proxy_pass         http://rift_web;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Colyseus matchmaking + WebSocket endpoints on /colyseus/*
    location /colyseus/ {
      proxy_pass http://rift_ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host       $host;
      proxy_read_timeout 3600s;
    }

    # Direct game-server WebSocket path (e.g. ws://host/matchmake/lobby)
    location /matchmake/ {
      proxy_pass http://rift_ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host       $host;
      proxy_read_timeout 3600s;
    }
  }
}